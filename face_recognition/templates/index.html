<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload files</title>
    <style>
        :root { --bg:#0f1115; --panel:#151923; --border:#2a3246; --text:#e6e6e6; --primary:#3b82f6; }
        body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 24px; background: var(--bg); color: var(--text); }
        h1 { margin-top: 0; }
        .card { max-width: 560px; padding: 24px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        label { display: block; margin-top: 12px; margin-bottom: 6px; font-weight: 600; }
        input[type="file"] { display: block; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #0f131d; color: var(--text); }
        button { margin-top: 16px; padding: 10px 16px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button[disabled] { opacity: .7; cursor: wait; }
        .overlay { position: fixed; inset: 0; background: rgba(15,17,21,0.85); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .overlay.show { display: flex; }
        .spinner { width: 48px; height: 48px; border: 4px solid #2a3246; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        .overlay-text { margin-top: 12px; color: #e6e6e6; font-weight: 600; text-align: center; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Upload two files</h1>
        <form id="upload_form" method="post" enctype="multipart/form-data">
            <label for="file1"><strong>Database file:</strong></label>
            <input type="file" name="file1" id="file1" required>
            
            <label for="file2"><strong>New embeddings file:</strong></label>
            <input type="file" name="file2" id="file2" required>
            
            <button id="start_btn" type="submit">Start</button>
        </form>
    </div>

    <div id="overlay" class="overlay" aria-hidden="true">
        <div style="display:flex; flex-direction:column; align-items:center;">
            <div class="spinner" aria-label="Uploading"></div>
            <div class="overlay-text">Uploading and preparing data...</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('upload_form');
        const btn = document.getElementById('start_btn');
        const overlay = document.getElementById('overlay');
        form.addEventListener('submit', () => {
            overlay.classList.add('show');
            btn.setAttribute('disabled', 'true');
        });
    </script>
</body>
</html>
